
[project]
name = 'stock_tool'
version = '0.1.0'
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "XlsxWriter",
    "platformdirs",
    "keyring",
    "PySide6"
]
authors = [
  {name = "Alexander Roe", email = "alexanderroe22@hotmail.com"}
]
license = "MIT"
readme = "README.md"


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"